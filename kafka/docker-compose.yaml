services:
  kafka-1:
    image: apache/kafka:latest
    container_name: kafka-1
    ports:
      - 9092:9092
    environment:
      KAFKA_KRAFT_MODE: "true"

      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,BROKER://0.0.0.0:9090,CONTROLLER://0.0.0.0:9091 
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,BROKER://kafka-1:9090
      KAFKA_INTER_BROKER_LISTENER_NAME: BROKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,BROKER:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_LOG_DIRS: /tmp/kafka-combined-logs
    
  kafka-2:
